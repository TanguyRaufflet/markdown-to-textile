<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Markdown to Textile Converter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>Markdown to Textile Converter</h2>

    <div class="form-group">
      <div class="label-row">
        <label for="markdown-input">Markdown:</label>
        <label class="toggle-label">
          <input type="checkbox" id="live-preview"> Live Preview
        </label>
      </div>
      <textarea id="markdown-input" rows="8" placeholder="Enter Markdown text here..."></textarea>
    </div>

    <div class="button-group">
      <button id="convert-btn" title="Ctrl+Enter">Convert</button>
      <button id="copy-btn" disabled>Copy to Clipboard</button>
      <button id="send-to-tab" disabled title="Send converted text to active tab">Send to Tab</button>
      <button id="clear-btn">Clear</button>
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="textile-output">Textile:</label>
        <select id="history-select" title="Conversion history">
          <option value="" disabled selected>History</option>
        </select>
      </div>
      <textarea id="textile-output" rows="8" readonly></textarea>
    </div>

    <div id="status-message" class="status-message"></div>
  </div>
  
  <script src="../markdown-to-textile.js"></script>
  <script src="popup.js"></script>
</body>
</html>
